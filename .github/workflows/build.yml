# Builds every push and pull request. The full Gradle output is also committed to the `ci-logs` branch
# (ci-logs/<branch>.log) so build errors can be read without opening the Actions page.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    if: github.ref != 'refs/heads/ci-logs'
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        id: build
        run: |
          set -o pipefail
          # gradle.properties points org.gradle.java.home at a Windows JDK; use the runner's JDK instead
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" build --continue --stacktrace --no-daemon 2>&1 | tee build.log
      - name: publish build log
        if: always() && github.event_name == 'push'
        run: |
          BR="${GITHUB_REF_NAME//\//_}"
          STATUS="${{ steps.build.outcome }}"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          cp build.log /tmp/build.log || echo "no log" > /tmp/build.log
          git fetch origin ci-logs || true
          if git rev-parse --verify origin/ci-logs >/dev/null 2>&1; then
            git checkout -B ci-logs origin/ci-logs
          else
            git checkout --orphan ci-logs
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p ci-logs
          { echo "status: $STATUS"; echo "commit: $GITHUB_SHA"; echo; cat /tmp/build.log; } > "ci-logs/$BR.log"
          git add "ci-logs/$BR.log"
          git commit -m "log $BR $GITHUB_SHA ($STATUS)" || true
          git push origin ci-logs
      - name: capture build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            build/libs/
            versions/*/build/libs/
