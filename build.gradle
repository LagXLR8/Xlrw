plugins {
    // Applies the correct Loom variant for the Minecraft version of this subproject
    id 'dev.kikugie.loom-back-compat'
}

version = "${property('mod.version')}+${sc.current.version}"
base.archivesName = property('mod.id') as String

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        xlrw {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runConfigs.all {
        ideConfigGenerated true
        runDir = '../../run' // one run folder shared by all versions
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${sc.current.version}"
    loomx.applyMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${property('deps.fabric_loader')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${property('deps.fabric_api')}"

    // MP3 decoding for the HUB jukebox (your own music). Bundled inside the mod jar.
    implementation 'javazoom:jlayer:1.0.1'
    include 'javazoom:jlayer:1.0.1'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

processResources {
    def props = [version: project.version.toString(), minecraft: project.property('mod.mc_compat').toString()]
    inputs.properties(props)
    filesMatching('fabric.mod.json') { expand(props) }
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) { rename { "${it}_xlrw" } }
}

// Copies this version's jar to build/libs/<mod version>/ in the root folder
tasks.register('buildAndCollect', Copy) {
    group = 'build'
    description = 'Builds the mod jar and copies it to build/libs/{mod version}/'
    from(loomx.modJar.flatMap { it.archiveFile })
    into(rootProject.layout.buildDirectory.dir("libs/${project.property('mod.version')}"))
}
